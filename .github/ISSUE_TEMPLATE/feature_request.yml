name: Feature request
description: Propose a safe, local-only improvement without sharing captured input.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow without attaching a macro, sensitive log, credential, or personal path.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety scope
      options:
        - label: This request does not require UAC bypass, hidden recording, injection, driver installation, telemetry, or anti-cheat bypass.
          required: true
